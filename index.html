<style>
body{margin:0}
[hidden]{display:none!important}
/* Layout: one working page. Period chips, four figures (net result first), then tabs for Summary, Money, Products, Expenses. Each entry tab has an add form above its list. */
:root{
  --bg:#F2F5F3; --surface:#FFFFFF; --ink:#13201B; --muted:#5A6B64; --line:#D9E1DD;
  --accent:#0E6B58; --accent-ink:#FFFFFF; --accent-soft:#DDEFE9;
  --bad:#B3261E; --bad-soft:#F9DDD9; --warn:#9A5200; --warn-soft:#FBE9CF;
  --display:"Inter","Helvetica Neue",Arial,sans-serif;
  --body:"Inter","Helvetica Neue",Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1512; --surface:#16201C; --ink:#E6EEEA; --muted:#93A59D; --line:#2A3731;
  --accent:#4FC3A5; --accent-ink:#06251D; --accent-soft:#17342C;
  --bad:#F08A82; --bad-soft:#3D1B18; --warn:#E3A24B; --warn-soft:#3A2A10; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1512; --surface:#16201C; --ink:#E6EEEA; --muted:#93A59D; --line:#2A3731;
  --accent:#4FC3A5; --accent-ink:#06251D; --accent-soft:#17342C;
  --bad:#F08A82; --bad-soft:#3D1B18; --warn:#E3A24B; --warn-soft:#3A2A10; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);padding-block:20px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.background-art{position:fixed;left:50%;top:50%;z-index:0;width:min(1200px,125vw);height:min(980px,125vh);color:var(--accent);opacity:.14;pointer-events:none;transform:translate(-50%,-50%);animation:art-scene 36s ease-in-out infinite alternate}
.background-art .float{transform-box:fill-box;transform-origin:center;animation:art-float 18s ease-in-out infinite alternate}
.background-art .trend{stroke-dasharray:12 14;animation:art-drift 32s linear infinite}
.background-art .coin{transform-box:fill-box;transform-origin:center;animation:art-pulse 7s ease-in-out infinite alternate}
.wrap{position:relative;z-index:1;max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.cur{font:500 .72em var(--mono);color:var(--muted);margin-right:.35em;letter-spacing:.04em}
.neg{color:var(--bad)}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:16px}
.top{display:flex;align-items:center;min-width:0}
.brand-stack{display:flex;flex-direction:column;align-items:flex-start;gap:12px;min-width:0}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand-mark{position:relative;width:110px;height:110px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#00b366,#00a65a);border:2px solid rgba(23,176,108,.8);box-shadow:0 16px 30px rgba(12,122,95,.18);flex-shrink:0;animation:brand-glow 4s ease-in-out infinite}
.brand-mark svg{width:100%;height:100%;display:block;color:rgba(150,223,160,.8)}
.brand-mark .brand-ring{stroke-dasharray:260 344;stroke-linecap:round;animation:brand-ring 8s linear infinite}
.brand-mark .brand-symbol{transform-box:fill-box;transform-origin:center;animation:brand-symbol 4s ease-in-out infinite}
.brand-name{font-family:var(--display);font-size:clamp(1.9rem,3vw,3rem);font-weight:800;letter-spacing:-.09em;line-height:.8;text-transform:uppercase;color:var(--accent);text-shadow:0 0 0 rgba(0,0,0,0);animation:brand-name-in .8s cubic-bezier(.2,.8,.2,1) .15s both}
header.top h1{font-size:30px;font-weight:700;letter-spacing:-.01em}
header.top p{margin:2px 0 0;color:var(--muted);font-size:13px}
.top-controls{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.language-control{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;font-weight:600}
.language-control select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px}
.theme-toggle{display:inline-grid;place-items:center;width:38px;height:38px;padding:0;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
.theme-toggle:hover{border-color:var(--accent);color:var(--accent)}
.theme-toggle svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.theme-toggle .sun-icon{display:none}
:root[data-theme="dark"] .theme-toggle .moon-icon{display:none}
:root[data-theme="dark"] .theme-toggle .sun-icon{display:block}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 14px;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.primary:hover{filter:brightness(1.08)}
.btn.small{padding:4px 10px;font-size:13px}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.note{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:10px 14px;font-size:13px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.note[hidden]{display:none}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 13px;font-size:13px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.figures{display:grid;grid-template-columns:1.3fr 1fr 1fr 1fr;gap:12px}
.fig{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-width:0}
.fig.lead{border-color:var(--accent);background:var(--accent-soft)}
.fig.lead.loss{border-color:var(--bad);background:var(--bad-soft)}
.fig .lab{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:500}
.fig .val{font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:-.02em;margin-top:4px;overflow-wrap:anywhere}
.fig.lead .val{font-size:34px}
.fig .sub{font-size:13px;color:var(--muted);margin-top:2px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:10px 14px;font-weight:600;color:var(--muted);margin-bottom:-1px;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;min-width:0}
.panel h2{font-size:17px;font-weight:700}
.hint{font-size:12.5px;color:var(--muted);margin:2px 0 12px}
.assign-row{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(180px,1fr) auto;gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.assign-row:last-child{border-bottom:0}
.assign-row .field{flex-direction:row;align-items:center;gap:8px}
.assign-row .field span{white-space:nowrap}
.credit-row{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(120px,.8fr) minmax(180px,1fr) auto;gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.credit-row:last-child{border-bottom:0}
.credit-customer .sm{display:block;font-size:12.5px;color:var(--muted)}
.credit-balance{font-family:var(--mono);font-size:16px;font-weight:700;color:var(--accent);white-space:nowrap}
form{display:flex;flex-direction:column;gap:12px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
#credit-details{grid-column:1/-1}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:13px;font-weight:600}
.field input,.field select{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 11px;width:100%;min-width:0}
.field input[type=checkbox]{width:auto}
.preview{background:var(--accent-soft);border-radius:8px;padding:10px 14px;font-size:14px;display:flex;flex-wrap:wrap;gap:4px 18px;align-items:baseline}
.preview b{font-family:var(--display);font-size:18px}
.preview.loss{background:var(--bad-soft)}
.err{color:var(--bad);font-size:13px;min-height:1em}
.list{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.cols,.row{display:grid;gap:8px 14px;align-items:center;padding:11px 16px}
.cols{font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line);padding-block:9px;font-weight:500}
.row{border-bottom:1px solid var(--line);font-size:14px}
.row:last-child{border-bottom:0}
.row .r,.cols .r{text-align:right}
.row .sm{display:block;font-size:12.5px;color:var(--muted)}
.row .nm{min-width:0;overflow-wrap:anywhere}
.row .nm b{font-weight:600}
.cc-money{grid-template-columns:minmax(0,1.5fr) minmax(0,1.4fr) minmax(0,1fr) minmax(0,1fr) auto}
.cc-prod{grid-template-columns:minmax(0,1.5fr) minmax(0,1.3fr) minmax(0,1fr) minmax(0,1fr) auto}
.cc-exp{grid-template-columns:minmax(0,1.5fr) minmax(0,1.5fr) minmax(0,1fr) auto}
.empty{padding:30px 20px;text-align:center;color:var(--muted)}
.empty h3{color:var(--ink);font-size:18px;margin-bottom:6px}
.empty p{margin:0 auto 14px;max-width:46ch}
.chart{overflow-x:auto}
.chart svg{display:block;width:100%;min-width:420px;height:auto}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .zero{stroke:var(--muted);stroke-width:1}
.chart .ax{fill:var(--muted);font:11px var(--mono)}
.chart .vl{fill:var(--ink);font:500 11px var(--mono)}
.chart .bar{fill:var(--accent);opacity:.45}
.chart .bar.now{opacity:1}
.chart .bar.neg{fill:var(--bad)}
.tbl{overflow-x:auto;margin-top:12px}
table{border-collapse:collapse;width:100%;min-width:480px;font-size:14px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right}
th:first-child,td:first-child{text-align:left}
th{font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:500}
tfoot td{font-weight:600}
.hday{display:flex;justify-content:space-between;gap:4px 16px;flex-wrap:wrap;padding:10px 16px;background:var(--accent-soft);border-bottom:1px solid var(--line);font-size:13px}
.hday b{font-family:var(--display);font-size:14px}
.hrow{display:grid;grid-template-columns:78px minmax(0,1fr) auto auto;gap:4px 12px;padding:10px 16px;border-bottom:1px solid var(--line);font-size:14px;align-items:baseline}
.hrow .tp{font-size:11.5px;font-weight:600;border-radius:99px;padding:2px 9px;background:var(--line);color:var(--muted);text-align:center}
.hrow .tx{min-width:0;overflow-wrap:anywhere}
.hrow .tx .sm{display:block;font:12.5px var(--mono);color:var(--muted)}
.hrow .rs{text-align:right}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:30;font-size:14px;max-width:90vw}
.toast[hidden]{display:none}
@media (max-width:820px){.figures{grid-template-columns:1fr 1fr}.fig.lead{grid-column:1 / -1}}
@media (max-width:620px){
  .background-art{width:125vw;height:110vh;opacity:.11}
  .topbar{align-items:flex-start;flex-direction:column}
  .assign-row{grid-template-columns:1fr}
  .credit-row{grid-template-columns:minmax(0,1fr) auto}
  .credit-customer{grid-column:1}
  .credit-balance{grid-column:2;grid-row:1}
  .credit-row .field,.credit-row .btn{grid-column:1/-1}
  .grid{grid-template-columns:1fr 1fr}
  .cols{display:none}
  .row{grid-template-columns:minmax(0,1fr) auto !important;grid-template-areas:"a b" "c c" "d d"}
  .row>*:nth-child(1){grid-area:a}.row>*:nth-child(2){grid-area:c}
  .row>.res{grid-area:b;text-align:right}
  .row>.act{grid-area:d}
  .row .r{text-align:left}
  .figures{grid-template-columns:1fr}
}
@media (max-width:380px){.grid{grid-template-columns:1fr}}
@keyframes art-float{from{transform:translate3d(0,8px,0)}to{transform:translate3d(-18px,-14px,0)}}
@keyframes art-drift{to{stroke-dashoffset:-208}}
@keyframes art-pulse{from{transform:translateY(0)}to{transform:translateY(-9px)}}
@keyframes art-scene{from{transform:translate(-50%,-50%) scale(1)}to{transform:translate(-50%,-50%) scale(1.06)}}
@keyframes brand-glow{0%,100%{box-shadow:0 16px 30px rgba(12,122,95,.18),0 0 0 0 rgba(23,176,108,0)}50%{box-shadow:0 18px 34px rgba(12,122,95,.28),0 0 0 7px rgba(23,176,108,.1)}}
@keyframes brand-ring{to{stroke-dashoffset:-604}}
@keyframes brand-symbol{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-2px) scale(1.025)}}
@keyframes brand-name-in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@media (prefers-reduced-motion:reduce){.background-art,.background-art .float,.background-art .trend,.background-art .coin,.brand-mark,.brand-mark .brand-ring,.brand-mark .brand-symbol,.brand-name{animation:none}}
</style>

</head>

<div class="wrap">

    var rows=months.slice().reverse().map(function(m){return '<tr><td>'+m.full+'</td><td class="num'+sgn(m.m)+'">'+fmt(m.m)+'</td><td class="num'+sgn(m.p)+'">'+fmt(m.p)+'</td><td class="num">'+fmt(m.e)+'</td><td class="num'+sgn(m.net)+'"><b>'+fmt(m.net)+'</b></td></tr>'}).join('');
    var all=months.reduce(function(a,m){a.m+=m.m;a.p+=m.p;a.e+=m.e;a.net+=m.net;return a},{m:0,p:0,e:0,net:0});
    return peopleSummaryHTML()+'<div class="panel"><h2>Net profit each month</h2><p class="hint">Profit from money and products, minus expenses. Red bars are months with a loss.</p><div class="chart">'+s+'</div>'+
      '<div class="tbl"><table><thead><tr><th>Month</th><th>Money</th><th>Products</th><th>Expenses</th><th>Net</th></tr></thead><tbody>'+rows+'</tbody>'+
      '<tfoot><tr><td>Last 6 months</td><td class="num'+sgn(all.m)+'">'+fmt(all.m)+'</td><td class="num'+sgn(all.p)+'">'+fmt(all.p)+'</td><td class="num">'+fmt(all.e)+'</td><td class="num'+sgn(all.net)+'">'+fmt(all.net)+'</td></tr></tfoot></table></div></div>';
  }

  /* ---- entry forms ---- */
  var FORMS={
    currency:{title:'Record a currency sale',hint:'Profit = (selling rate − buying rate) × amount − fees.',fields:
      '<div class="field"><label for="f-date">Date</label><input id="f-date" type="date" value="'+TODAY+'"></div>'+
      '<div class="field"><label for="f-person">Person</label><input id="f-person" type="text" autocomplete="name"></div>'+
      '<div class="field"><label for="f-cur">Currency</label><input id="f-cur" type="text" value="USD" maxlength="8" autocomplete="off"></div>'+
      '<div class="field"><label for="f-amt">Amount sold</label><input id="f-amt" type="number" inputmode="decimal" min="0" step="any"></div>'+
      '<div class="field"><label for="f-buy">Buying rate (RWF per 1)</label><input id="f-buy" type="number" inputmode="decimal" min="0" step="any"></div>'+
      '<div class="field"><label for="f-sell">Selling rate (RWF per 1)</label><input id="f-sell" type="number" inputmode="decimal" min="0" step="any"></div>'+
      '<div class="field"><label for="f-fees">Fees (RWF, optional)</label><input id="f-fees" type="number" inputmode="decimal" min="0" step="any"></div>'},
    products:{title:'Record a product sale',hint:'Profit = selling price − cost price.',fields:
      '<div class="field"><label for="f-date">Date</label><input id="f-date" type="date" value="'+TODAY+'"></div>'+
      '<div class="field"><label for="f-person">Person</label><input id="f-person" type="text" autocomplete="name"></div>'+
      '<div class="field"><label for="f-name">Product</label><input id="f-name" type="text" autocomplete="off"></div>'+
      '<div class="field"><label for="f-cost">Cost price per item (RWF)</label><input id="f-cost" type="number" inputmode="decimal" min="0" step="any"></div>'+
      '<div class="field"><label for="f-price">Selling price per item (RWF)</label><input id="f-price" type="number" inputmode="decimal" min="0" step="any"></div>'+
      '<div class="field"><label><input id="f-credit" type="checkbox"> Sell on credit</label></div>'+
      '<div class="grid" id="credit-details" hidden><div class="field"><label for="f-buyer">Buyer name</label><input id="f-buyer" type="text" autocomplete="off"></div>'+
      '<div class="field"><label for="f-paid-now">Paid now (RWF)</label><input id="f-paid-now" type="number" inputmode="decimal" min="0" step="any" value="0"><span class="hint">Enter upfront payment, or leave 0 for full credit.</span></div></div>'},
    expenses:{title:'Record an expense',hint:'Transport, rent, airtime, salaries, fees and anything else you spend to run the business.',fields:
      '<div class="field"><label for="f-date">Date</label><input id="f-date" type="date" value="'+TODAY+'"></div>'+
      '<div class="field"><label for="f-person">Person</label><input id="f-person" type="text" autocomplete="name"></div>'+
      '<div class="field"><label for="f-cat">Category</label><select id="f-cat">'+CATS.map(function(c){return '<option value="'+esc(c)+'">'+esc(c)+'</option>'}).join('')+'</select></div>'+
      '<div class="field"><label for="f-desc">Description</label><input id="f-desc" type="text" autocomplete="off"></div>'+
      '<div class="field"><label for="f-exp">Amount (RWF)</label><input id="f-exp" type="number" inputmode="decimal" min="0" step="any"></div>'}
  };
  function formHTML(k){
    var f=FORMS[k];
    return '<div class="panel"><h2>'+f.title+'</h2><p class="hint">'+f.hint+'</p><form id="entryForm" novalidate><div class="grid">'+f.fields+'</div>'+
      (k==='expenses'?'':'<div class="preview" id="preview"></div>')+
      '<div class="err" id="err" role="alert"></div><div><button class="btn primary" type="submit">Save</button></div></form></div>';
  }
  function num(id){var el=$('#'+id);return el?(parseFloat(el.value)||0):0}
  function updatePreview(){
    var p=$('#preview');if(!p)return;
    if(tab==='currency'){
      var a=num('f-amt'),b=num('f-buy'),s=num('f-sell'),fe=num('f-fees');
      if(a>0&&b>0&&s>0){var pr=a*(s-b)-fe;p.className='preview'+(pr<0?' loss':'');p.innerHTML='<span>You paid <b class="num">RWF '+fmt(a*b)+'</b></span><span>You receive <b class="num">RWF '+fmt(a*s)+'</b></span><span>'+(pr<0?'Loss':'Profit')+' <b class="num">RWF '+fmt(Math.abs(pr))+'</b></span>'}
      else{p.className='preview';p.innerHTML='<span>Enter the amount and both rates to see your profit.</span>'}
    }else if(tab==='products'){
      var q=1,c=num('f-cost'),pz=num('f-price');
      if(q>0&&c>0&&pz>0){var pf=q*(pz-c),pc=(pz-c)/c*100;p.className='preview'+(pf<0?' loss':'');p.innerHTML='<span>Total cost <b class="num">RWF '+fmt(q*c)+'</b></span><span>Total sales <b class="num">RWF '+fmt(q*pz)+'</b></span><span>'+(pf<0?'Loss':'Profit')+' <b class="num">RWF '+fmt(Math.abs(pf))+'</b> ('+pc.toLocaleString(locale(),{minimumFractionDigits:1,maximumFractionDigits:1})+'% on cost)</span>'+(($('#f-credit')||{}).checked?'<span>Credit balance <b class="num">RWF '+fmt(Math.max(0,q*pz-num('f-paid-now')) )+'</b></span>':'')}
      else{p.className='preview';p.innerHTML='<span>Enter the cost and selling price to see your profit.</span>'}
    }
    if(p)localize(p);
  }

  /* ---- lists ---- */
  function delBtn(coll,id){
    var on=pendingDel&&pendingDel.c===coll&&pendingDel.id===id;
    return '<span class="act"><button class="btn small'+(on?' danger':'')+'" data-del="'+coll+'" data-id="'+esc(id)+'">'+(on?'Click again to delete':'Delete')+'</button></span>';
  }
  function ownerLine(x){
    var person=String(x.person||'').trim();
    return person?'<span class="sm"><span>Person</span>: <b data-user-text>'+esc(person)+'</b></span>':'<span class="sm">Unassigned</span>';
  }
  function emptyHTML(title,desc){return '<div class="empty"><h3>'+title+'</h3><p>'+desc+'</p></div>'}
  function listHTML(k){
    if(!loaded)return '<div class="list"><div class="empty"><p>Loading your records…</p></div></div>';
    var arr=data[k].slice().sort(function(a,b){return b.date.localeCompare(a.date)||b.id.localeCompare(a.id)});
    var inP=arr.filter(function(x){return inPeriod(x.date)});
    var head,rows;
    if(!arr.length){
      var ex=k==='currency'?['No currency sales yet','Record your first sale above. Your profit is the selling rate minus the buying rate, times the amount.']:k==='products'?['No product sales yet','Record your first sale above. Your profit is the selling price minus the cost price.']:['No expenses yet','Add what you spend on transport, rent, airtime and salaries so your net profit is accurate.'];
      return '<div class="list">'+emptyHTML(ex[0],ex[1])+'</div>';
    }
    if(!inP.length)return '<div class="list">'+emptyHTML('Nothing in this period','Pick a longer period above to see older records ('+arr.length+' saved).')+'</div>';
    if(k==='currency'){
      head='<div class="cols cc-money"><span>Sale</span><span>Rates (RWF)</span><span class="r">Cost</span><span class="r">Profit / loss</span><span></span></div>';
      rows=inP.map(function(x){var p=cProfit(x);return '<div class="row cc-money"><div class="nm"><b><span data-user-text>'+esc(x.cur)+'</span> '+fmt(x.amount)+'</b><span class="sm">'+dstr(x.date)+'</span>'+ownerLine(x)+'</div><div><span class="num">'+x.buy+' → '+x.sell+'</span>'+(x.fees?'<span class="sm">Fees '+fmt(x.fees)+'</span>':'')+'</div><div class="r num">'+fmt(x.amount*x.buy)+'</div><div class="r res num'+sgn(p)+'">'+(p<0?'-':'')+fmt(Math.abs(p))+'</div>'+delBtn(k,x.id)+'</div>'}).join('');
    }else if(k==='products'){
      head='<div class="cols cc-prod"><span>Product</span><span>Cost → price</span><span class="r">Sales</span><span class="r">Profit / loss</span><span></span></div>';
      rows=inP.map(function(x){var p=pProfit(x);return '<div class="row cc-prod"><div class="nm"><b data-user-text>'+esc(x.name)+'</b><span class="sm">'+dstr(x.date)+' · '+fmt(x.qty)+' sold</span>'+ownerLine(x)+(x.credit?'<span class="sm">Credit sale to <b data-user-text>'+esc(x.buyer)+'</b> · <span>Paid now</span> '+money(x.paidNow||0)+' · <span>Credit balance</span> '+money(Math.max(0,x.qty*x.price-(Number(x.paidNow)||0)))+'</span>':'')+'</div><div class="num">'+fmt(x.cost)+' → '+fmt(x.price)+'</div><div class="r num">'+fmt(x.qty*x.price)+'</div><div class="r res num'+sgn(p)+'">'+(p<0?'-':'')+fmt(Math.abs(p))+'</div>'+delBtn(k,x.id)+'</div>'}).join('');
    }else{
      head='<div class="cols cc-exp"><span>Expense</span><span>Description</span><span class="r">Amount</span><span></span></div>';
      rows=inP.map(function(x){return '<div class="row cc-exp"><div class="nm"><b data-user-text>'+esc(x.cat)+'</b><span class="sm">'+dstr(x.date)+'</span>'+ownerLine(x)+'</div><div class="nm" data-user-text>'+esc(x.desc||'—')+'</div><div class="r res num">'+fmt(x.amount)+'</div>'+delBtn(k,x.id)+'</div>'}).join('');
    }
    return '<div class="list">'+head+rows+'</div>';
  }

  function refreshList(){if(tab==='history')renderBody();else{$('#list').innerHTML=listHTML(tab);localize($('#list'))}}
  function delAllHTML(n){
    return '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px">'+(pendingAll?'<button class="btn danger small" data-delall="1">Click again to delete all '+n+' records</button><button class="btn small" data-cancel="1">Cancel</button>':'<button class="btn small" data-delall="1">Delete all history</button>')+'</div>';
  }
  function delAll(){
    if(store){
      var ps=[];STORAGE_COLL.forEach(function(k){data[k].forEach(function(x){ps.push(store.collection(k).doc(x.id).delete())})});
      return Promise.all(ps).then(function(){return true},function(e){toast('Could not delete everything. '+((e&&e.message)||'Try again.'));return false});
    }
    STORAGE_COLL.forEach(function(k){data[k]=[]});lsWrite();renderAll();return Promise.resolve(true);
  }

  /* ---- history: every record with its calculation ---- */
  function historyHTML(){
    if(!loaded)return '<div class="list"><div class="empty"><p>Loading your records…</p></div></div>';
    var ev=[];
    data.currency.forEach(function(x){ev.push({d:x.date,id:x.id,c:'currency',type:'Money',title:x.cur+' '+fmt(x.amount),person:x.person||'',calc:fmt(x.amount)+' × ('+x.sell+' − '+x.buy+')'+(x.fees?' − '+fmt(x.fees)+' fees':''),res:cProfit(x)})});
    data.products.forEach(function(x){ev.push({d:x.date,id:x.id,c:'products',type:'Product',title:x.name+' ('+fmt(x.qty)+' sold)',person:x.person||'',calc:fmt(x.qty)+' × ('+fmt(x.price)+' − '+fmt(x.cost)+')'+(x.credit?' · '+tr('Credit sale to')+' '+x.buyer+' · '+tr('Paid now')+' '+fmt(x.paidNow||0)+' · '+tr('Credit balance')+' '+fmt(Math.max(0,x.qty*x.price-(Number(x.paidNow)||0))):''),res:pProfit(x)})});
    data.expenses.forEach(function(x){ev.push({d:x.date,id:x.id,c:'expenses',type:'Expense',title:x.cat+(x.desc?' · '+x.desc:''),person:x.person||'',calc:'Money spent, subtracted from profit',res:-x.amount})});
    data.repayments.forEach(function(x){ev.push({d:x.date,id:x.id,c:'repayments',type:'Repayment',title:tr('Repayment received')+' · '+x.buyer+' · '+money(x.amount),person:'',calc:'Repayment reduces outstanding credit; it is not new profit',res:0})});
    if(!ev.length)return '<div class="list">'+emptyHTML('No history yet','Every sale and expense you save will appear here with the calculation behind it, grouped by day with a running total.')+'</div>';
    ev.sort(function(a,b){return a.d.localeCompare(b.d)||a.id.localeCompare(b.id)});
    var days=[],map={},run=0;
    ev.forEach(function(e){var g=map[e.d];if(!g){g=map[e.d]={d:e.d,items:[],net:0};days.push(g)}g.items.push(e);g.net+=e.res;run+=e.res;g.run=run});
    days.reverse();
    return '<div class="panel"><h2>History</h2><p class="hint">All saved records, newest day first. Each line shows how its result was calculated. The running total is your net profit or loss from your first record up to the end of that day. Not affected by the period buttons. Delete removes one record. Delete all history clears everything and cannot be undone.</p>'+delAllHTML(ev.length)+'</div>'+
      '<div class="list">'+days.map(function(g){
        return '<div class="hday"><b>'+dstr(g.d)+'</b><span>Day result <span class="num'+sgn(g.net)+'">'+money(g.net)+'</span></span><span>Running total <span class="num'+sgn(g.run)+'">'+money(g.run)+'</span></span></div>'+
          g.items.slice().reverse().map(function(e){return '<div class="hrow"><span class="tp">'+tr(e.type)+'</span><div class="tx"><b data-user-text>'+esc(e.title)+'</b><span class="sm">'+esc(e.calc)+'</span>'+(e.c==='repayments'?'':'<span class="sm">'+(e.person?'<span>Person</span>: <b data-user-text>'+esc(e.person)+'</b>':'Unassigned')+'</span>')+'</div><div class="rs num'+sgn(e.res)+'">'+(e.res<0?'-':'')+fmt(Math.abs(e.res))+'</div>'+delBtn(e.c,e.id)+'</div>'}).join('');
      }).join('')+'</div>';
  }

  /* ---- render ---- */
  function renderBody(){
    if(tab==='summary'){$('#body').innerHTML=summaryHTML();localize($('#body'));return}
    if(tab==='history'){$('#body').innerHTML='<div style="display:flex;flex-direction:column;gap:18px">'+historyHTML()+'</div>';localize($('#body'));return}
    $('#body').innerHTML='<div style="display:flex;flex-direction:column;gap:18px">'+formHTML(tab)+'<div id="list">'+listHTML(tab)+'</div></div>';
    localize($('#body'));
    updatePreview();
  }
  function renderAll(){
    renderFigures();
    if(tab==='summary'||tab==='history')renderBody();else $('#list').innerHTML=listHTML(tab);
    localize(document.querySelector('.wrap'));
  }

  /* ---- events ---- */
  document.addEventListener('click',function(e){
    var t=e.target.closest('button');if(!t)return;
    if(t.id==='theme-toggle'){setTheme(theme==='dark'?'light':'dark');return}
    if(t.dataset.repay){
      var row=t.closest('.credit-row'),amount=parseFloat(row.querySelector('[data-repayment-amount]').value);
      if(!Number.isFinite(amount)){toast('Enter an amount greater than zero.');return}
      recordRepayment(t.dataset.buyer,amount);
      return;
    }
    if(t.dataset.assign){
      var row=t.closest('.assign-row'),person=row.querySelector('[data-owner-input]').value.trim();
      if(!person){toast('Enter the person’s name.');return}
      assignRecord(t.dataset.coll,t.dataset.id,person);
      return;
    }
    if(t.dataset.delall){
      if(pendingAll){pendingAll=false;delAll().then(function(ok){if(ok){toast('All history deleted');renderBody()}})}
      else{pendingAll=true;pendingDel=null;renderBody()}
      return;
    }
    if(t.dataset.cancel){pendingAll=false;pendingDel=null;renderBody();return}
    if(t.dataset.p){period=t.dataset.p;pendingDel=null;pendingAll=false;document.querySelectorAll('#periods .chip').forEach(function(b){b.setAttribute('aria-pressed',b===t)});renderAll();return}
    if(t.dataset.t){tab=t.dataset.t;pendingDel=null;pendingAll=false;document.querySelectorAll('#tabs .tab').forEach(function(b){b.setAttribute('aria-selected',b===t)});renderBody();return}
    if(t.dataset.del){
      var c=t.dataset.del,id=t.dataset.id;
      if(pendingDel&&pendingDel.c===c&&pendingDel.id===id){pendingDel=null;del(c,id).then(function(ok){if(ok)toast('Deleted')});}
      else{pendingDel={c:c,id:id};pendingAll=false;refreshList()}
    }
  });
  document.addEventListener('change',function(e){
    if(e.target.id==='language')setLanguage(e.target.value);
    if(e.target.id==='f-credit'){
      $('#credit-details').hidden=!e.target.checked;
      updatePreview();
    }
  });
  document.addEventListener('input',function(e){if(e.target.closest('#entryForm'))updatePreview()});
  document.addEventListener('submit',function(e){
    if(e.target.id!=='entryForm')return;
    e.preventDefault();
    var date=$('#f-date').value,person=$('#f-person').value.trim(),err='',doc=null,k=tab;
    if(!date)err='Pick the date.';
    else if(!person)err='Enter the person’s name.';
    else if(k==='currency'){
      var cur=$('#f-cur').value.trim().toUpperCase(),a=num('f-amt'),b=num('f-buy'),s=num('f-sell'),fe=num('f-fees');
      if(!cur)err='Enter the currency, for example USD.';
      else if(a<=0)err='Enter the amount you sold.';
      else if(b<=0)err='Enter your buying rate.';
      else if(s<=0)err='Enter your selling rate.';
      else doc={id:uid(),date:date,person:person,cur:cur,amount:a,buy:b,sell:s,fees:fe};
    }else if(k==='products'){
      var nm=$('#f-name').value.trim(),q=1,c=num('f-cost'),pz=num('f-price');
      var credit=$('#f-credit').checked,buyer=$('#f-buyer').value.trim(),paidNow=num('f-paid-now'),saleTotal=q*pz;
      if(!nm)err='Enter the product name.';
      else if(c<=0)err='Enter the cost price per item.';
      else if(pz<=0)err='Enter the selling price per item.';
      else if(credit&&!buyer)err='Enter buyer name.';
      else if(credit&&paidNow<0)err='Paid amount cannot be negative.';
      else if(credit&&paidNow>saleTotal)err='Paid amount cannot exceed sale total.';
      else{
        doc={id:uid(),date:date,person:person,name:nm,qty:q,cost:c,price:pz};
        if(credit){doc.credit=true;doc.buyer=buyer;doc.paidNow=paidNow}
      }
    }else{
      var am=num('f-exp');
      if(am<=0)err='Enter the amount spent.';
      else doc={id:uid(),date:date,person:person,cat:$('#f-cat').value,desc:$('#f-desc').value.trim(),amount:am};
    }
    $('#err').textContent=tr(err);
    if(!doc)return;
    save(k,doc).then(function(ok){
      if(!ok)return;
      toast('Saved');
      var keepDate=date;renderBody();$('#f-date').value=keepDate;
    });
  });

  /* ---- start ---- */
  document.title=tr('HEEZA SYSTEM');
  renderFigures();renderBody();localize(document.querySelector('.wrap'));
  /* ---- XAMPP storage: talks to api.php (PHP + MySQL) ---- */
  function makeStore(){
    var API='api.php',subs={};
    function req(url,opts){
      return fetch(url,opts).then(function(r){
        return r.text().then(function(t){
          var j;try{j=JSON.parse(t)}catch(e){throw new Error('Server did not return data. Is Apache running and api.php in the same folder?')}
          if(!r.ok||j.error)throw new Error(j.error||('HTTP '+r.status));
          return j;
        });
      });
    }
    function snapOf(rows){return {docs:rows.map(function(r){return {id:r.id,data:function(){return r}}})}}
    function pull(k){
      var c=subs[k];if(!c)return Promise.resolve();
      return req(API+'?c='+k).then(function(rows){
        c.failed=false;
        var sig=JSON.stringify(rows);
        if(sig!==c.sig){c.sig=sig;c.ok(snapOf(rows))}
      },function(){
        if(!c.failed){c.failed=true;c.err()}
      });
    }
    setInterval(function(){Object.keys(subs).forEach(pull)},5000);
    return {collection:function(k){return {
      doc:function(id){return {
        set:function(doc){return req(API+'?c='+k+'&id='+encodeURIComponent(id),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(doc)}).then(function(){return pull(k)})},
        delete:function(){return req(API+'?c='+k+'&id='+encodeURIComponent(id)+'&action=delete',{method:'POST'}).then(function(){return pull(k)})}
      }},
      onSnapshot:function(ok,err){subs[k]={ok:ok,err:err,sig:null,failed:false};pull(k)}
    }}};
  }
  var timer,useP=Promise.resolve(makeStore());
  useP.then(function(db){
    if(!db){localMode=true;lsRead();loaded=true;renderAll();return}
    store=db;
    timer=setTimeout(function(){if(!loaded){var n=$('#note');n.hidden=false;n.textContent=tr('Your saved records cannot be reached yet. Check your connection.')}},10000);
    STORAGE_COLL.forEach(function(k){
      db.collection(k).onSnapshot(function(snap){
        loaded=true;clearTimeout(timer);
        data[k]=snap.docs.map(function(d){return Object.assign({},d.data(),{id:d.id})});
        renderAll();
      },function(){
        loaded=true;clearTimeout(timer);renderAll();
        var n=$('#note');n.hidden=false;n.textContent=tr('Saved records stopped updating. Reload the page to reconnect.');
      });
    });
  }).catch(function(){localMode=true;lsRead();loaded=true;renderAll()});
})();
</script>
</body>
